<section id="hero" class="hero-section">
  <div #heroBg class="hero-bg-mesh"></div>
  
  <div class="container hero-container">
    <div #heroContent class="hero-content">
      <h4 class="hero-greeting">Hello, I am Naivedh Patel</h4>
      <h1 class="hero-title">Full Stack Developer</h1>
      <p class="hero-tagline">
        I build scalable web applications from database to UI with Angular, Node.js, Express, and MongoDB.
      </p>

      <div class="hero-cta">
        <button class="btn btn-primary" (click)="scrollToProjects()">View Projects</button>
        <button class="btn btn-outline" (click)="scrollToContact()">Contact Me</button>
      </div>
    </div>
  </div>

  <!-- Vertical Socials -->
  <div class="social-vertical">
    <a href="https://github.com/naivedhP2518" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="GitHub">
      <lucide-icon [name]="GithubIcon"></lucide-icon>
    </a>
    <a href="mailto:naivedhpatel25@gmail.com" class="social-link">
      <lucide-icon [name]="MailIcon"></lucide-icon>
    </a>
    <div class="vertical-line"></div>
  </div>

  <!-- Scroll Indicator -->
  <div class="scroll-indicator" (click)="scrollToAbout()">
    <lucide-icon [name]="ArrowIcon" class="bounce"></lucide-icon>
    <span>Scroll</span>
  </div>
</section>
