<section id="skills" class="skills-section section-padding">
  <div class="container">
    <div class="section-header text-center">
      <p class="section-tag">Technology</p>
      <h2 class="section-title">Tools I use to build</h2>
      <p class="section-intro">A practical toolkit for building responsive interfaces, APIs, and data-backed applications.</p>
    </div>

    <div class="skills-grid">
      <article class="skill-group-card glass" *ngFor="let group of skillGroups">
        <h3 class="row-title">{{ group.name }}</h3>
        <ul class="skill-list">
          <li *ngFor="let skill of group.skills">{{ skill }}</li>
        </ul>
      </article>
    </div>
  </div>
</section>
