<section id="skills" class="skills-section section-padding">
  <div class="container">
    <div class="section-header text-center">
      <h4 class="section-tag">Technical Proficiency</h4>
      <h2 class="section-title">Development <span class="text-gradient">Skills</span></h2>
    </div>

    <div class="marquee-container skills-groups">
      <div class="marquee-row-wrapper" *ngFor="let group of skillGroups">
        <div class="row-header">
          <h3 class="row-title">{{ group.name }}</h3>
        </div>
        <div class="marquee-wrapper fade-edges">
          <div class="marquee-track skills-track">
            <div *ngFor="let skill of group.skills" class="marquee-card glass">
              <h4 class="card-title">{{ skill }}</h4>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
