<nav [class.scrolled]="isScrolled()" [class.glass]="isScrolled()" class="navbar">
  <div class="container nav-content">
    <a class="logo" href="#hero" (click)="scrollToSection('#hero', $event)">
      <lucide-icon [name]="PointerIcon" class="logo-icon"></lucide-icon>
      <span class="logo-text">NAIVEDH<span class="text-gradient">.PATEL</span></span>
    </a>

    <!-- Desktop Nav -->
    <ul class="nav-links">
      <li *ngFor="let link of navLinks">
        <a [href]="link.href" (click)="scrollToSection(link.href, $event)" class="nav-link">{{ link.name }}</a>
      </li>
    </ul>

    <div class="nav-actions">
      <a href="https://github.com/naivedhP2518" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="GitHub">
        <lucide-icon [name]="GithubIcon"></lucide-icon>
      </a>
      <button type="button" class="mobile-toggle" (click)="toggleMenu()" [attr.aria-label]="isMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'" [attr.aria-expanded]="isMenuOpen()" aria-controls="mobile-menu">
        <lucide-icon [name]="isMenuOpen() ? XIcon : MenuIcon"></lucide-icon>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="mobile-menu" [class.open]="isMenuOpen()">
    <ul class="mobile-nav-links">
      <li *ngFor="let link of navLinks">
        <a [href]="link.href" (click)="scrollToSection(link.href, $event)" class="mobile-nav-link">{{ link.name }}</a>
      </li>
    </ul>
  </div>
</nav>
