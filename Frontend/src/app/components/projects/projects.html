<section id="projects" class="projects-section section-padding">
  <div class="container">
    <div class="section-header">
      <h4 class="section-tag">Selected Work</h4>
      <h2 class="section-title">Full Stack <span class="text-gradient">Projects</span></h2>
    </div>

    <div class="projects-grid">
      <article *ngFor="let project of projects" class="project-card glass" #projectCard>
        <div class="project-image-wrapper">
          <img *ngIf="project.image" [src]="resolveUrl(project.image)" [alt]="project.title + ' application screenshot'" class="project-image" loading="lazy" decoding="async">
          <div class="category-pill">{{ project.category }}</div>
        </div>

        <div class="project-info">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="tools-list" aria-label="Technology stack">
            <span *ngFor="let tool of project.tools" class="tool-tag">{{ tool }}</span>
          </div>
          <p class="project-feature"><strong>Key feature:</strong> {{ project.feature || 'TODO: Add key feature or problem solved.' }}</p>
          <div class="project-actions">
            <a *ngIf="project.link; else missingDemo" [href]="project.link" target="_blank" rel="noopener noreferrer" class="btn btn-primary project-action">Live Demo</a>
            <ng-template #missingDemo><span class="project-todo">TODO: Add Live Demo URL</span></ng-template>
            <a *ngIf="project.github; else missingGithub" [href]="project.github" target="_blank" rel="noopener noreferrer" class="btn btn-outline project-action">GitHub</a>
            <ng-template #missingGithub><span class="project-todo">TODO: Add GitHub URL</span></ng-template>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
